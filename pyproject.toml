[project]
name = "carrot-leaf"
version = "0.8.1"
description = "Download and convert videos from YouTube and 1,300+ other sites in your terminal. Runs on yt-dlp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yore Des", email = "designsbyyore@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["youtube", "yt-dlp", "downloader", "tui", "terminal", "converter", "mp3"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # The app itself is the Rust `carrot` binary in the wheel; it runs these as programs.
    "yt-dlp[default]>=2026.8.19",
    "deno>=2.0",
]

[project.urls]
Homepage = "https://github.com/Yore-Des/carrot-leaf"
Issues = "https://github.com/Yore-Des/carrot-leaf/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    { include-group = "python-app" },
]
# The original Python app in src/carrot_leaf. It isn't shipped any more, but it is kept as
# the reference the Rust port and benchmarks/compare.py are measured against.
python-app = [
    "textual>=8.2",
    "pillow>=10",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "pillow-heif>=0.18",
    "pillow-jxl-plugin>=1.3",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# Ship the Rust app as the `carrot` program in a platform wheel.
bindings = "bin"
manifest-path = "rust/Cargo.toml"
strip = true

[tool.uv]
# Developing doesn't build the Rust wheel into the venv; `uv build` and CI do.
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
