[package]
name = "carrot-leaf"
version = "0.8.0"
edition = "2024"
description = "Download and convert videos from YouTube and 1,300+ other sites in your terminal. Runs on yt-dlp."
license = "MIT"

[[bin]]
name = "carrot"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
percent-encoding = "2"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tempfile = "3"
toml = "0.8"
unicode-width = "0.2.0"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
